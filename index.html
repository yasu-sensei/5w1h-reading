<body>
  <header class="site-header"><button type="button" id="brand-home" aria-label="よんで みつけよう ホーム">▤ <span>よんで みつけよう</span></button><span class="header-note">ことばの たんけん</span></header>
  <main id="app"><p role="status">じゅんびを しています…</p></main>
  <noscript>このゲームにはJavaScriptが必要です。</noscript>
  <footer>あわてなくて だいじょうぶ。こたえの ヒントは ぶんの なかに。</footer>
  <script>
(() => {
const categories = { Who: 'だれ', When: 'いつ', Where: 'どこ', What: 'なに', Why: 'なぜ', How: 'どのように', WhatKind: 'どのような' };
const STORAGE_KEY = '5w1h-reading:progress:v1';
const DAILY_KEY = '5w1h-reading:daily:v1';
function japanDay(date = new Date()) {
  return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
}
function decodeDaily(raw, sets) {
  if (raw === null) return null;
  const saved = JSON.parse(raw);
  if (saved?.version !== 1 || !/^\d{4}-\d{2}-\d{2}$/.test(saved.date) || !sets.some(s => s.id === saved.setId) || typeof saved.cleared !== 'boolean') throw new Error('1日の進捗データが不正です');
  return saved;
}
function dailyPlan(sets, completed, daily, date = japanDay()) {
  if (daily?.date === date) return { state: daily.cleared ? 'done' : 'resume', setId: daily.setId };
  const next = nextSet(sets, completed);
  return next ? { state: 'ready', setId: next.id } : { state: 'all-done', setId: null };
}
function validateSet(set) {
  if (!Number.isInteger(set.level) || set.level < 1 || set.level > 5 || set.sentences.length < 2 || set.sentences.length > 4 || set.questions.length !== 4) throw new Error(`本文・問題数・レベルが不正: ${set.id}`);
  for (const q of set.questions) {
    if (!(q.category in categories) || q.reasoning !== 'explicit' || q.choices.length !== 3 || new Set(q.choices).size !== 3 || !Number.isInteger(q.correct) || q.correct < 0 || q.correct > 2 || !q.evidence.length || q.evidence.some(n => !Number.isInteger(n) || n < 1 || n > set.sentences.length)) throw new Error(`設問が不正: ${q.id}`);
  }
}
function completeAnswers(answers) {
  return Array.isArray(answers) && answers.length === 4 && answers.every(a => Number.isInteger(a) && a >= 0 && a <= 2);
}
function grade(set, answers) {
  if (!completeAnswers(answers)) throw new Error('未回答があります');
  return set.questions.map((q, i) => ({ ...q, index: i, answer: answers[i], ok: answers[i] === q.correct }));
}
function nextSet(sets, completed) { return sets.find(s => !completed.includes(s.id)); }
function retryEvidence(set, previousAnswers, questionIndex) {
  if (!completeAnswers(previousAnswers)) return [];
  const q = set.questions[questionIndex];
  return previousAnswers[questionIndex] === q.correct ? [] : q.evidence;
}
function recordResult(progress, set, answers) {
  const passed = grade(set, answers).every(q => q.ok);
  return {
    completed: passed ? [...new Set([...progress.completed, set.id])] : [...progress.completed],
    last: { setId: set.id, answers: [...answers] }
  };
}
function decodeProgress(raw, data) {
  if (raw === null) return { completed: [], last: null };
  const saved = JSON.parse(raw);
  const compatible = saved?.contentVersion === data.version || data.compatibleVersions?.includes(saved?.contentVersion);
  if (saved?.storageVersion !== 1 || !compatible || !Array.isArray(saved.completed) || saved.completed.some(id => !data.sets.some(s => s.id === id))) throw new Error('保存データの形式または教材の版が異なります');
  if (saved.last !== null) {
    const set = data.sets.find(s => s.id === saved.last?.setId);
    if (!set || !completeAnswers(saved.last.answers)) throw new Error('保存結果が不正です');
  }
  return { completed: [...new Set(saved.completed)], last: saved.last };
}
function encodeProgress(state, version) {
  return JSON.stringify({ storageVersion: 1, contentVersion: version, completed: state.completed, last: state.last });
}

const app = document.querySelector('#app');
const labels = ['あ', 'い', 'う'];
const escape = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let data, progress = { completed: [], last: null }, notice = '', saveMessage = '', daily = null;
let screen = 'home', set, answers, question = 0, speech = false, previousAnswers = null, retryArrival = false;
